name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (editable)
        run: python -m pip install --disable-pip-version-check -e .

      - name: Unit tests
        run: python -m unittest discover -s tests -v

  package:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check build
      - run: python -m build
      - name: Install the built wheel and smoke-test it
        run: |
          python -m pip install --disable-pip-version-check dist/*.whl
          python -c "import importlib.metadata as m; print('installed', m.version('agent-referee-gate'))"
          agent-referee --help
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
