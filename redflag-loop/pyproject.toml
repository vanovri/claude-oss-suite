[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "redflag-loop"
version = "0.1.0"
description = "Evidence-gated loop guard for autonomous coding agents: detects repeated actions, stuck iterations and unsupported 'done' claims."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ardhya Novri Ramadhan" }]
requires-python = ">=3.10"
keywords = ["ai-agents", "agent-loops", "guardrails", "claude", "llm", "verification", "devtools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.2", "twine>=5.0", "pytest>=8.0"]

[project.scripts]
redflag-loop = "redflag_loop.cli:main"

[project.urls]
Homepage = "https://github.com/vanovri/redflag-loop"
Repository = "https://github.com/vanovri/redflag-loop"
Issues = "https://github.com/vanovri/redflag-loop/issues"

[tool.setuptools]
packages = ["redflag_loop"]
