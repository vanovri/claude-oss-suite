name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install --upgrade pip build
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test (clean log must exit 0)
        run: python -m redflag_loop.cli check examples/clean_events.jsonl
      - name: CLI smoke test (looping log must exit 1)
        shell: bash
        run: |
          python -m redflag_loop.cli check examples/loop_events.jsonl && exit 1 || true
      - name: Walkthrough example
        run: python examples/guard_walkthrough.py

  package:
    name: build sdist and wheel
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: redflag-loop check examples/clean_events.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
