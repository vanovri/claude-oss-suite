name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test (clean bundle is signable)
        run: python -m open_dmrv.cli verify examples/batches_pass.json
      - name: CLI smoke test (violating bundle must exit 1)
        shell: bash
        run: |
          python -m open_dmrv.cli verify examples/batches_fail.json && exit 1 || test $? -eq 1
      - name: Merkle root is stable across runs
        shell: bash
        run: |
          first=$(python -m open_dmrv.cli merkle examples/batches_pass.json)
          second=$(python -m open_dmrv.cli merkle examples/batches_pass.json)
          test "$first" = "$second"

  package:
    name: build sdist and wheel
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: open-dmrv verify examples/batches_pass.json
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
