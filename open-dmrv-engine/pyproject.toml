[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-dmrv-engine"
version = "0.1.0"
description = "Deterministic MRV gates for pyrolysis carbon removal: mass balance, thermal regime and H/C_org permanence must pass before a Merkle root is signed."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ardhya Novri Ramadhan" }]
requires-python = ">=3.10"
keywords = ["carbon-removal", "cdr", "dmrv", "biochar", "pyrolysis", "mrv", "merkle", "verification"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.2", "twine>=5.0", "pytest>=8.0"]

[project.scripts]
open-dmrv = "open_dmrv.cli:main"

[project.urls]
Homepage = "https://github.com/vanovri/open-dmrv-engine"
Repository = "https://github.com/vanovri/open-dmrv-engine"
Issues = "https://github.com/vanovri/open-dmrv-engine/issues"

[tool.setuptools]
packages = ["open_dmrv"]
